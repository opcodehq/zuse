[profile.default]
# A test that runs past a minute is hung, not slow: kill it and say which one.
slow-timeout = { period = "15s", terminate-after = 4 }

[profile.ci]
# One retry: a test that fails and then passes is reported as FLAKY in the
# log instead of failing the whole run. A test that fails twice still fails.
retries = 1
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "15s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"

[test-groups.cloud-postgres]
max-threads = 4

[test-groups.cloud-staging]
max-threads = 1

[[profile.ci.overrides]]
# Start long timing and recovery scenarios early so they overlap short tests.
filter = 'test(sync_keeps_git_available_with_256_file_descriptors) | test(delayed_registry_survives_blackout_and_reset_without_losing_writes) | test(cold_jobs_get_a_real_timed_turn_without_any_writer_ending) | test(multimodal_results_remain_structured_and_oversized_frames_pause_without_retry)'
priority = 100

[[profile.ci.overrides]]
# These fixtures intentionally recreate the same schema and restricted role.
# Their in-process STAGING_SCHEMA_LOCK cannot serialize nextest processes.
filter = 'package(zuse-cloud) & (test(managed_bases::admission::) | test(runtime::admission_batch::))'
test-group = 'cloud-staging'

[[profile.ci.overrides]]
# Each test process tree has private temporary storage for effect locks. Bound
# guest concurrency to avoid exhausting the shared PostgreSQL connection budget.
filter = 'package(zuse-cloud) & (binary(postgres) | test(staging_pilot_is_separate_bounded_and_reconciles_original_effects))'
test-group = 'cloud-postgres'
