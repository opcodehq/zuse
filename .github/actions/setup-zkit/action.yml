name: Set up private toolkit access
description: Configure Cargo Git fetches for the pinned Zkit dependency
inputs:
  token:
    description: Read-only token with access to opcodehq/zkit
    required: true
runs:
  using: composite
  steps:
    - name: Configure toolkit authentication
      shell: bash
      env:
        ZKIT_READ_TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "$ZKIT_READ_TOKEN" ]; then
          echo '::error::Add the ZKIT_READ_TOKEN Actions secret with read-only access to opcodehq/zkit. The default repository token cannot read the private toolkit repository.'
          exit 1
        fi
        auth_header=$(printf 'x-access-token:%s' "$ZKIT_READ_TOKEN" | base64 | tr -d '\r\n')
        echo "::add-mask::$auth_header"
        git config --global http.https://github.com/opcodehq/zkit.extraheader "AUTHORIZATION: basic $auth_header"
        echo 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"
