name: Control artifacts
on:
  workflow_dispatch:
    inputs:
      publish_sdk:
        description: Publish the matching SDK to npm
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: packages/sdk
      - run: cargo build --locked --release -p zuse-control --target ${{ matrix.target }}
      - run: node scripts/package-control.mjs target/${{ matrix.target }}/release/zuse-control .context/control
        env:
          ZUSE_PACKAGE_CROSS: ${{ matrix.target == 'x86_64-apple-darwin' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: zuse-control-${{ matrix.target }}
          path: .context/control
  publish:
    needs: bundle
    if: inputs.publish_sdk
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci && npm test && npm publish --access public
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
