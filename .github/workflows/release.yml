name: Release

# Builds the native packages from a version tag and publishes them as a
# GitHub release. Push a `vX.Y.Z` tag whose version matches the workspace
# version and has a matching `## X.Y.Z` section in CHANGELOG.md; a tag with a
# pre-release suffix (`v0.27.0-preview.1`) publishes a pre-release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.26.0)
        required: true
      formats_only:
        description: Add installers and missing architectures to an existing release
        type: boolean
        default: false
      archive_run_id:
        description: Optional previous installer run whose verified native inputs should be reused
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    if: inputs.formats_only != true
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      prebuilt_run_id: ${{ steps.prebuilt.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Older release tags do not contain the current note selector. Keep the
      # workflow's tooling separate, while reading the tagged changelog in cwd.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
          sparse-checkout: |
            scripts/release_notes.py
            scripts/distribution.py
          sparse-checkout-cone-mode: false
      - id: version
        name: Match the tag to the workspace version and changelog
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Expected a version tag such as v0.26.0-preview.1"
            exit 1
          fi
          workspace=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          base="${version%%-*}"
          if [ "$base" != "$workspace" ]; then
            echo "::error::Tag $TAG does not match workspace version $workspace"
            exit 1
          fi
          python3 release-tools/scripts/release_notes.py "$TAG" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$base" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - id: prebuilt
        name: Find binaries main already built for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/prebuild.yml/runs?head_sha=$commit&event=push&branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty') || run=
          if [ -n "$run" ]; then
            available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("unsigned-")))] | length') || available=0
            if [ "$available" != 5 ]; then run=; fi
          fi
          echo "run_id=$run" >> "$GITHUB_OUTPUT"
          echo "Prebuilt run for $commit: ${run:-none, compiling now}"

  # Only runs when main has no finished build of the tagged commit.
  binaries:
    needs: verify
    if: needs.verify.outputs.prebuilt_run_id == ''
    permissions:
      contents: read
    uses: ./.github/workflows/native-binaries.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
    secrets:
      HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}

  package:
    needs: [verify, binaries]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.binaries.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          # Unsigned portable zip; Windows code signing is not set up yet.
          - os: windows-latest
            platform: windows
            arch: x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-${{ matrix.platform }}-${{ matrix.arch }}
          run-id: ${{ needs.verify.outputs.prebuilt_run_id || github.run_id }}
          github-token: ${{ github.token }}
      # Downloads the pinned toolkit for its licence files; runs no dependency code.
      - run: cargo fetch --locked
      - run: python scripts/package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --version "${{ needs.verify.outputs.version }}" --skip-build --output dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: zuse-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release/zuse-*
          if-no-files-found: error

  # Signs on a runner that has never run dependency build code, so nothing a
  # build script left behind can use the identity or read the credentials.
  sign-macos:
    needs: [verify, binaries]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.binaries.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-macos-${{ matrix.arch }}
          run-id: ${{ needs.verify.outputs.prebuilt_run_id || github.run_id }}
          github-token: ${{ github.token }}
      # Downloads the pinned toolkit for its licence files; runs no dependency code.
      - run: cargo fetch --locked
      # Tagged releases must be signed; local packaging can still be unsigned.
      - name: Load the macOS signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::error::CSC_LINK is required for macOS releases"
            exit 1
          fi
          keychain="$RUNNER_TEMP/zuse-signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          keychains=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; line="${line#\"}"; line="${line%\"}"
            [ -n "$line" ] && keychains+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$identity" ]; then
            echo "::error::The certificate in CSC_LINK has no Developer ID Application identity"
            exit 1
          fi
          echo "ZUSE_MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "ZUSE_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Package, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_ID:?Set the APPLE_ID repository secret for notarization}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Set the APPLE_APP_SPECIFIC_PASSWORD repository secret}"
          : "${APPLE_TEAM_ID:?Set the APPLE_TEAM_ID repository secret}"
          python scripts/package.py --platform macos --arch ${{ matrix.arch }} --version "${{ needs.verify.outputs.version }}" --skip-build --output dist/release
      # Runs even when setup failed part-way, before the keychain was exported.
      - name: Remove the signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          keychain="$RUNNER_TEMP/zuse-signing.keychain-db"
          if [ -e "$keychain" ]; then security delete-keychain "$keychain"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: zuse-macos-${{ matrix.arch }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  # Runs only once every archive and installer exists, so a release is never
  # visible with some formats missing.
  publish:
    needs: [verify, package, sign-macos, distributions]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
          sparse-checkout: |
            scripts/release_notes.py
            scripts/distribution.py
            scripts/distribution-notes.py
            scripts/publish_distributions.py
            scripts/install.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: zuse-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-output-*
          path: dist/release
          merge-multiple: true
      - name: Require every format, then write checksums and notes
        run: |
          cp release-tools/scripts/install.sh dist/release/install.sh
          python3 release-tools/scripts/publish_distributions.py --check-only "$TAG" dist/release
          cd dist/release
          sha256sum zuse-* install.sh > SHA256SUMS
          cat SHA256SUMS
          cd ../..
          python3 release-tools/scripts/release_notes.py "$TAG" > dist/changelog.md
          test -s dist/changelog.md
          python3 release-tools/scripts/distribution-notes.py "$TAG" dist/changelog.md > dist/notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          if [ "${{ needs.verify.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --clobber
            gh release edit "$TAG" --notes-file dist/notes.md --draft=false "${flags[@]}"
          else
            gh release create "$TAG" dist/release/* --verify-tag \
              --title "Zuse ${{ needs.verify.outputs.version }}" \
              --notes-file dist/notes.md "${flags[@]}"
          fi

  distributions:
    needs: [package, sign-macos]
    if: ${{ !cancelled() && (inputs.formats_only == true || (needs.package.result == 'success' && needs.sign-macos.result == 'success')) }}
    uses: ./.github/workflows/distributions.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      archive_run_id: ${{ inputs.formats_only == true && inputs.archive_run_id || '' }}
      staged: ${{ inputs.formats_only != true }}
    secrets: inherit
