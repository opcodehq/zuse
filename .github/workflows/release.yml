name: Release

# Builds the native packages from a version tag and publishes them as a
# GitHub release. Push a `vX.Y.Z` tag whose version matches the workspace
# version and has a matching `## X.Y.Z` section in CHANGELOG.md; a tag with a
# pre-release suffix (`v0.27.0-preview.1`) publishes a pre-release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.26.0)
        required: true
      formats_only:
        description: Add installers and missing architectures to an existing release
        type: boolean
        default: false
      archive_run_id:
        description: Optional previous installer run whose verified native inputs should be reused
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    if: inputs.formats_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      prebuilt_run_id: ${{ steps.prebuilt.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Older release tags do not contain the current note selector. Keep the
      # workflow's tooling separate, while reading the tagged changelog in cwd.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
          sparse-checkout: |
            scripts/release_notes.py
            scripts/distribution.py
            scripts/release_prebuild.py
          sparse-checkout-cone-mode: false
      - id: version
        name: Match the tag to the workspace version and changelog
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Expected a version tag such as v0.26.0-preview.1"
            exit 1
          fi
          workspace=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          base="${version%%-*}"
          if [ "$base" != "$workspace" ]; then
            echo "::error::Tag $TAG does not match workspace version $workspace"
            exit 1
          fi
          python3 release-tools/scripts/release_notes.py "$TAG" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$base" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - id: prebuilt
        name: Find binaries main already built for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 release-tools/scripts/release_prebuild.py --commit "$(git rev-parse HEAD)"

  web:
    needs: verify
    if: needs.verify.outputs.prebuilt_run_id == ''
    uses: ./.github/workflows/release-web.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
    secrets:
      HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}

  build-linux-x64:
    needs: verify
    if: needs.verify.outputs.prebuilt_run_id == ''
    uses: ./.github/workflows/native-compile.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      os: ubuntu-24.04
      platform: linux
      arch: x86_64
      target: x86_64-unknown-linux-gnu
    secrets:
      HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}

  package-linux-x64:
    needs: [verify, web, build-linux-x64]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' &&
        (needs.verify.outputs.prebuilt_run_id != '' ||
        (needs.web.result == 'success' && needs.build-linux-x64.result == 'success')) }}
    uses: ./.github/workflows/native-package.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      os: ubuntu-24.04
      platform: linux
      arch: x86_64
      version: ${{ needs.verify.outputs.version }}
      artifact_run_id: ${{ needs.verify.outputs.prebuilt_run_id || github.run_id }}

  build-linux-arm64:
    needs: verify
    if: needs.verify.outputs.prebuilt_run_id == ''
    uses: ./.github/workflows/native-compile.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      os: ubuntu-24.04-arm
      platform: linux
      arch: aarch64
      target: aarch64-unknown-linux-gnu
    secrets:
      HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}

  package-linux-arm64:
    needs: [verify, web, build-linux-arm64]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' &&
        (needs.verify.outputs.prebuilt_run_id != '' ||
        (needs.web.result == 'success' && needs.build-linux-arm64.result == 'success')) }}
    uses: ./.github/workflows/native-package.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      os: ubuntu-24.04-arm
      platform: linux
      arch: aarch64
      version: ${{ needs.verify.outputs.version }}
      artifact_run_id: ${{ needs.verify.outputs.prebuilt_run_id || github.run_id }}

  build-macos-arm64:
    needs: verify
    if: needs.verify.outputs.prebuilt_run_id == ''
    uses: ./.github/workflows/native-compile.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      os: macos-latest
      platform: macos
      arch: aarch64
      target: aarch64-apple-darwin
    secrets:
      HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}

  package-macos-arm64:
    needs: [verify, web, build-macos-arm64]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' &&
        (needs.verify.outputs.prebuilt_run_id != '' ||
        (needs.web.result == 'success' && needs.build-macos-arm64.result == 'success')) }}
    uses: ./.github/workflows/native-package.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      os: macos-latest
      platform: macos
      arch: aarch64
      version: ${{ needs.verify.outputs.version }}
      artifact_run_id: ${{ needs.verify.outputs.prebuilt_run_id || github.run_id }}
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  build-macos-x64:
    needs: verify
    if: needs.verify.outputs.prebuilt_run_id == ''
    uses: ./.github/workflows/native-compile.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      os: macos-latest
      platform: macos
      arch: x86_64
      target: x86_64-apple-darwin
    secrets:
      HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}

  package-macos-x64:
    needs: [verify, web, build-macos-x64]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' &&
        (needs.verify.outputs.prebuilt_run_id != '' ||
        (needs.web.result == 'success' && needs.build-macos-x64.result == 'success')) }}
    uses: ./.github/workflows/native-package.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      os: macos-15-intel
      platform: macos
      arch: x86_64
      version: ${{ needs.verify.outputs.version }}
      artifact_run_id: ${{ needs.verify.outputs.prebuilt_run_id || github.run_id }}
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  build-windows-x64:
    needs: verify
    if: needs.verify.outputs.prebuilt_run_id == ''
    uses: ./.github/workflows/native-compile.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      os: windows-latest
      platform: windows
      arch: x86_64
      target: x86_64-pc-windows-msvc
    secrets:
      HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}

  package-windows-x64:
    needs: [verify, web, build-windows-x64]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' &&
        (needs.verify.outputs.prebuilt_run_id != '' ||
        (needs.web.result == 'success' && needs.build-windows-x64.result == 'success')) }}
    uses: ./.github/workflows/native-package.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      os: windows-latest
      platform: windows
      arch: x86_64
      version: ${{ needs.verify.outputs.version }}
      artifact_run_id: ${{ needs.verify.outputs.prebuilt_run_id || github.run_id }}

  # Runs only once every archive and installer exists, so a release is never
  # visible with some formats missing.
  publish:
    needs: [verify, package-linux-x64, package-linux-arm64, package-macos-arm64, package-macos-x64, package-windows-x64, distributions]
    # Build jobs are intentionally skipped when reusing prebuilt inputs.
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' &&
        needs.package-linux-x64.result == 'success' &&
        needs.package-linux-arm64.result == 'success' &&
        needs.package-macos-arm64.result == 'success' &&
        needs.package-macos-x64.result == 'success' &&
        needs.package-windows-x64.result == 'success' &&
        needs.distributions.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
          sparse-checkout: |
            scripts/release_notes.py
            scripts/distribution.py
            scripts/distribution-notes.py
            scripts/publish_distributions.py
            scripts/install.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: zuse-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-output-*
          path: dist/release
          merge-multiple: true
      - name: Require every format, then write checksums and notes
        run: |
          cp release-tools/scripts/install.sh dist/release/install.sh
          python3 release-tools/scripts/publish_distributions.py --check-only "$TAG" dist/release
          # The standalone command ships beside every app archive.
          version="${{ needs.verify.outputs.version }}"
          for archive in linux-x86_64.tar.gz linux-aarch64.tar.gz macos-aarch64.tar.gz macos-x86_64.tar.gz windows-x86_64.zip; do
            if [ ! -f "dist/release/zuse-cli-$version-$archive" ]; then
              echo "::error::Release is missing zuse-cli-$version-$archive"
              exit 1
            fi
          done
          cd dist/release
          sha256sum zuse-* install.sh > SHA256SUMS
          cat SHA256SUMS
          cd ../..
          python3 release-tools/scripts/release_notes.py "$TAG" > dist/changelog.md
          test -s dist/changelog.md
          python3 release-tools/scripts/distribution-notes.py "$TAG" dist/changelog.md --cli-archives > dist/notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          if [ "${{ needs.verify.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --clobber
            gh release edit "$TAG" --notes-file dist/notes.md --draft=false "${flags[@]}"
          else
            gh release create "$TAG" dist/release/* --verify-tag \
              --title "Zuse ${{ needs.verify.outputs.version }}" \
              --notes-file dist/notes.md "${flags[@]}"
          fi

  distributions:
    needs: [package-linux-x64, package-linux-arm64, package-macos-arm64, package-macos-x64, package-windows-x64]
    if: ${{ !cancelled() && (inputs.formats_only == true || (needs.package-linux-x64.result == 'success' && needs.package-linux-arm64.result == 'success' && needs.package-macos-arm64.result == 'success' && needs.package-macos-x64.result == 'success' && needs.package-windows-x64.result == 'success')) }}
    uses: ./.github/workflows/distributions.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      archive_run_id: ${{ inputs.formats_only == true && inputs.archive_run_id || '' }}
      staged: ${{ inputs.formats_only != true }}
    secrets: inherit
