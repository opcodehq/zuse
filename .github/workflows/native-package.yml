name: Package native release

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      os:
        type: string
        required: true
      platform:
        type: string
        required: true
      arch:
        type: string
        required: true
      version:
        type: string
        required: true
      artifact_run_id:
        type: string
        required: true
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  package:
    if: inputs.platform != 'macos'
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-${{ inputs.platform }}-${{ inputs.arch }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: dist/web
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      # Downloads the pinned toolkit for its licence files; runs no dependency code.
      - run: cargo fetch --locked
      - run: python scripts/package.py --platform ${{ inputs.platform }} --arch ${{ inputs.arch }} --version "${{ inputs.version }}" --skip-build --output dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: zuse-${{ inputs.platform }}-${{ inputs.arch }}
          path: dist/release/zuse-*
          if-no-files-found: error

  # Fresh runner: no dependency build code runs with signing credentials.
  sign-macos:
    if: inputs.platform == 'macos'
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-macos-${{ inputs.arch }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: dist/web
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      # Downloads the pinned toolkit for its licence files; runs no dependency code.
      - run: cargo fetch --locked
      # Tagged releases must be signed; local packaging can still be unsigned.
      - name: Load the macOS signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::error::CSC_LINK is required for macOS releases"
            exit 1
          fi
          keychain="$RUNNER_TEMP/zuse-signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          keychains=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; line="${line#\"}"; line="${line%\"}"
            [ -n "$line" ] && keychains+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$identity" ]; then
            echo "::error::The certificate in CSC_LINK has no Developer ID Application identity"
            exit 1
          fi
          echo "ZUSE_MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "ZUSE_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Package, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_ID:?Set the APPLE_ID repository secret for notarization}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Set the APPLE_APP_SPECIFIC_PASSWORD repository secret}"
          : "${APPLE_TEAM_ID:?Set the APPLE_TEAM_ID repository secret}"
          python scripts/package.py --platform macos --arch ${{ inputs.arch }} --version "${{ inputs.version }}" --skip-build --output dist/release
      # Runs even when setup failed part-way, before the keychain was exported.
      - name: Remove the signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          keychain="$RUNNER_TEMP/zuse-signing.keychain-db"
          if [ -e "$keychain" ]; then security delete-keychain "$keychain"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: zuse-macos-${{ inputs.arch }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

