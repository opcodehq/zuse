name: Validate

# Branches are validated through their pull request; running on both events
# doubled every build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The macOS test suite is too slow for per-change runs on a free runner;
  # it runs nightly (and on demand) instead.
  schedule:
    - cron: '30 21 * * *'

concurrency:
  group: validate-${{ github.ref }}
  # Main always finishes, so its caches get saved for every branch.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# PR validation targets five minutes, including setup and tests. Reuse trusted
# build artifacts and compile each package set once with the CI Cargo profile.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # A pull request runs the macOS check only when it touches desktop code or a
  # file with macOS-specific paths; main and nightly always run it.
  platforms:
    runs-on: boat-large
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.select.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          native='["boat-large","macos-latest"]'
          # A diff GitHub refuses to list, or a deleted file, keeps macOS on.
          if [ -n "$PR" ] && changed=$(gh pr diff "$PR" --name-only); then
            desktop='^(apps/desktop/|crates/(ui|text|viewport|preview|simulator|update)/|dist/macos/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'
            missing=$(printf '%s\n' "$changed" | while IFS= read -r file; do if [ ! -f "$file" ]; then printf '%s\n' "$file"; fi; done)
            if [ -z "$missing" ] && ! grep -qE "$desktop" <<<"$changed" && ! xargs -d '\n' grep -qE 'target_os *= *"macos"' <<<"$changed"; then
              native='["boat-large"]'
            fi
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"

  # Everything that needs no Rust build: formatting, scripts, JS tests.
  checks:
    runs-on: boat-large
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: opcodehq/zkit
          ref: 14d9b82fb65d86f63b6332cb3d616f1ab0ada103
          path: vendor/zkit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: python3 scripts/check-localization.py
      - name: Script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: JS tests
        run: node --test scripts/analytics-dashboards.test.mjs apps/web/tests/*.mjs
      - name: SDK tests
        working-directory: packages/sdk
        run: npm ci && npm test

  rust:
    runs-on: boat-large
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v1-ci
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-workspace-crates: true
          cache-directories: .context/ci-source-cache.json
      - name: Restore unchanged source timestamps
        run: python3 scripts/ci_source_cache.py restore
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ hashFiles('scripts/ci-ubuntu-dependencies.sh') }}-cmake-libclang-dev-libasound2-dev-ripgrep
      - run: bash scripts/ci-apt-install.sh ~/apt-debs cmake libclang-dev libasound2-dev ripgrep
      - name: Build and test Rust packages once
        run: bash scripts/ci-rust.sh rust
      - name: SDK against the engine
        env:
          ZUSE_SERVER_BINARY: ${{ github.workspace }}/target/ci/zuse-cli
          ZUSE_CONTROL_BINARY: ${{ github.workspace }}/target/ci/zuse-control
        working-directory: packages/sdk
        run: npm ci && npm run test:engine
      - name: Record source fingerprints for the build cache
        if: always()
        run: python3 scripts/ci_source_cache.py save

  harness-evaluation:
    runs-on: boat-large
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v1-ci
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-workspace-crates: true
          cache-directories: .context/ci-source-cache.json
      - name: Restore unchanged source timestamps
        run: python3 scripts/ci_source_cache.py restore
      - uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ hashFiles('scripts/ci-ubuntu-dependencies.sh') }}-ripgrep
      - run: bash scripts/ci-apt-install.sh ~/apt-debs ripgrep
      - run: cargo build --locked --release -p zuse-harness --example harness-evaluate
      - run: python3 scripts/test-harness-evaluation.py --binary target/release/examples/harness-evaluate --output .context/native-transport-fixtures
      - name: Record source fingerprints for the build cache
        if: always()
        run: python3 scripts/ci_source_cache.py save

  native:
    needs: platforms
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.native) }}
    runs-on: ${{ matrix.os }}
    env:
      HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}
      HUGEICONS_SOLID_VERSION: ${{ vars.HUGEICONS_SOLID_VERSION }}
      # Read by the update footer tests at run time.
      ZUSE_CLOUD: '1'
    steps:
      - if: runner.os == 'Linux'
        name: Free runner disk space
        # In the background: deleting these takes a minute or two and the
        # build only needs the space once it starts writing test binaries.
        run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      - uses: actions/checkout@v4
      - run: python3 scripts/cargo_dev.py --github-env
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST HUGEICONS_BUILD_KEY"
          prefix-key: v1-ci
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-workspace-crates: true
          cache-directories: .context/ci-source-cache.json
      - name: Restore unchanged source timestamps
        run: python3 scripts/ci_source_cache.py restore
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ hashFiles('scripts/ci-ubuntu-dependencies.sh') }}-build-essential-cmake-clang-libclang-dev-pkg-config-libssl-dev-libfontconfig-dev-libfreetype-dev-libxcb1-dev-libxcb-shape0-dev-libxcb-xfixes0-dev-libxkbcommon-dev-libxkbcommon-x11-dev-libwayland-dev-libvulkan-dev-libasound2-dev-libwebkit2gtk-4.1-dev-libjson-glib-dev
      - if: runner.os == 'Linux'
        run: bash scripts/ci-apt-install.sh ~/apt-debs build-essential cmake clang libclang-dev pkg-config libssl-dev libfontconfig-dev libfreetype-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libasound2-dev libwebkit2gtk-4.1-dev libjson-glib-dev
      - if: runner.os == 'macOS'
        run: cargo check --locked --profile ci -p zuse -p zuse-cli -p zuse-relay -p zuse-remote
      - if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # After `cargo check`: the bundle-identity test reads the pinned
      # toolkit's legal files out of the fetched crate sources.
      - if: runner.os == 'macOS'
        name: Microphone helper cross-compilation and bundle identity
        run: |
          python -m unittest discover -s scripts -p test_macos_permission.py
          python scripts/test_package.py PackagingTests.test_macos_package_identity_allows_bundle_signing
      - if: runner.os == 'Linux'
        name: Tests
        run: bash scripts/ci-rust.sh native
      # Per change, macOS only proves the desktop app compiles (above); its
      # test build alone takes over ten minutes on the free runner.
      - if: runner.os == 'macOS' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        name: Tests
        run: cargo nextest run --locked --cargo-profile ci --profile ci -p zuse-ui --lib
      - name: macOS AppKit quit drains the engine before termination
        if: runner.os == 'macOS' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          cargo build --locked --profile ci -p zuse-ui --example desktop-quit-fixture
          python3 - <<'PY'
          import fcntl
          from pathlib import Path
          import subprocess
          import tempfile
          with tempfile.TemporaryDirectory(prefix='zuse-appkit-quit-') as temporary:
              profile = Path(temporary)
              subprocess.run(['target/ci/examples/desktop-quit-fixture', str(profile)], check=True, timeout=20)
              assert (profile / 'saved-before-termination').read_text() == 'settled'
              with (profile / 'engine.lock').open('a') as lock:
                  fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
          PY
      - name: Record source fingerprints for the build cache
        if: always()
        run: python3 scripts/ci_source_cache.py save

  browser:
    runs-on: boat-large
    env:
      HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}
      HUGEICONS_SOLID_VERSION: ${{ vars.HUGEICONS_SOLID_VERSION }}
      CARGO_TARGET_DIR: target/browser
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/cargo_dev.py --github-env
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser
          workspaces: ". -> target/browser"
          cache-on-failure: true
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST HUGEICONS_BUILD_KEY"
          prefix-key: v1-ci
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-workspace-crates: true
          cache-directories: .context/ci-source-cache.json
      - name: Restore unchanged source timestamps
        run: python3 scripts/ci_source_cache.py restore
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      # Pull requests only need to know the app compiles and bundles; the
      # size-optimized build (codegen-units=1 plus wasm-opt) is what releases
      # ship, so main keeps exercising it.
      - if: github.ref != 'refs/heads/main'
        run: bash scripts/build-web.sh
      - if: github.ref == 'refs/heads/main'
        run: bash scripts/build-web.sh --release
      - run: cargo +nightly check --locked -p zuse-remote --target wasm32-unknown-unknown
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: zuse-browser
          path: dist/web
      - name: Record source fingerprints for the build cache
        if: always()
        run: python3 scripts/ci_source_cache.py save
