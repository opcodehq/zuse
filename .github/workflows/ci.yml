name: Validate

on:
  push:
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo check -p zuse-cli
      - run: cargo test -p zuse-model -p zuse-serve
      - run: cargo test -p zuse-rpc --lib
      - run: cargo test -p zuse-engine --lib account::tests
      - run: cargo test -p zuse-engine -p zuse-mcp --lib plugin

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential cmake clang libclang-dev pkg-config libssl-dev
          libfontconfig-dev libfreetype-dev libxcb1-dev libxcb-shape0-dev
          libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          libvulkan-dev libasound2-dev libwebkit2gtk-4.1-dev libjson-glib-dev
      - run: cargo check -p zuse

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - run: bash scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zuse-browser
          path: dist/web
