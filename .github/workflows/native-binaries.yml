name: Native binaries

# Compiles the browser assets and every platform's executables without packaging
# them, so one build can be signed and released later under any preview version.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      retention_days:
        type: number
        default: 2
    # These jobs run dependency build code, so they never receive signing secrets.
    secrets:
      HUGEICONS_LICENSE_KEY:
        required: false

jobs:
  web:
    uses: ./.github/workflows/release-web.yml
    with:
      ref: ${{ inputs.ref }}
      retention_days: ${{ inputs.retention_days }}
    secrets:
      HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            platform: macos
            arch: aarch64
            target: aarch64-apple-darwin
          - os: macos-latest
            platform: macos
            arch: x86_64
            target: x86_64-apple-darwin
          - os: windows-latest
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
    uses: ./.github/workflows/native-compile.yml
    with:
      ref: ${{ inputs.ref }}
      os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      target: ${{ matrix.target }}
      retention_days: ${{ inputs.retention_days }}
    secrets:
      HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}
