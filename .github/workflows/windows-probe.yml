name: Release dry run

# Temporary: runs the release build and signing jobs from this branch without
# publishing anything. Removed before merge.
on:
  push:
    branches: [swarajbachu/windows-release]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: aarch64
          # Unsigned portable zip; Windows code signing is not set up yet.
          - os: windows-latest
            platform: windows
            arch: x86_64
    runs-on: ${{ matrix.os }}
    # Git Bash on Windows, so build-web.sh and the steps below run unchanged.
    defaults:
      run:
        shell: bash
    env:
      HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}
      HUGEICONS_SOLID_VERSION: ${{ vars.HUGEICONS_SOLID_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      # The browser client rebuilds std for wasm threads.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang libclang-dev pkg-config libssl-dev libfontconfig-dev libfreetype-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libasound2-dev libwebkit2gtk-4.1-dev libjson-glib-dev
      - run: cargo fetch --locked
      # Dependency build scripts run on this runner, so it never receives the
      # signing certificate or Apple credentials.
      - name: Build
        run: python scripts/package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --build-only
      - name: Package
        if: runner.os != 'macOS'
        run: python scripts/package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --skip-build --output dist/release
      - if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: zuse-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release/zuse-*
          if-no-files-found: error
      # The macOS build is signed on a fresh runner by the sign-macos job.
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            target/release/zuse
            target/release/zuse-server
            target/release/zuse-relay
            dist/web
          if-no-files-found: error
          retention-days: 1

  # Signs on a runner that has never run dependency build code, so nothing a
  # build script left behind can use the identity or read the credentials.
  sign-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-macos-aarch64
      # Downloads the pinned toolkit for its licence files; runs no dependency code.
      - run: cargo fetch --locked
      # Without the secrets the macOS package is built unsigned, with a warning.
      - name: Load the macOS signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::CSC_LINK is not set; the macOS package will be unsigned and not notarized"
            exit 0
          fi
          keychain="$RUNNER_TEMP/zuse-signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          keychains=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; line="${line#\"}"; line="${line%\"}"
            [ -n "$line" ] && keychains+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$identity" ]; then
            echo "::error::The certificate in CSC_LINK has no Developer ID Application identity"
            exit 1
          fi
          echo "ZUSE_MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "ZUSE_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Package, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/package.py --platform macos --arch aarch64 --skip-build --output dist/release
      # Runs even when setup failed part-way, before the keychain was exported.
      - name: Remove the signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          keychain="$RUNNER_TEMP/zuse-signing.keychain-db"
          if [ -e "$keychain" ]; then security delete-keychain "$keychain"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: zuse-macos-aarch64
          path: dist/release/*.tar.gz
          if-no-files-found: error
