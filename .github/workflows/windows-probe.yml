name: Windows probe

on:
  push:
    branches: [swarajbachu/windows-release]

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --locked --release -p zuse -p zuse-cli -p zuse-relay --bins
      - run: Get-ChildItem target/release/*.exe | Select-Object Name, Length
