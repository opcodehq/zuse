name: Prebuild release binaries

# Tagging a commit built here skips compilation and only signs, packages and
# publishes. Let the active build finish and warm the cache; GitHub keeps only the newest pending push.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prebuild-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  binaries:
    uses: ./.github/workflows/native-binaries.yml
    with:
      ref: ${{ github.sha }}
      retention_days: 14
    secrets:
      HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}
