name: Cloud control plane

on:
  push:
    paths:
      - apps/cloud/**
      - crates/cloud/**
      - crates/protocol/src/cloud*.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/cloud.yml
  pull_request:
    paths:
      - apps/cloud/**
      - crates/cloud/**
      - crates/protocol/src/cloud*.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/cloud.yml

permissions:
  contents: read

jobs:
  cloud:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      ZUSE_CLOUD_TEST_DATABASE_URL: postgres://zuse_test:zuse_test@127.0.0.1:5432/zuse_test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: zuse_test
          POSTGRES_PASSWORD: zuse_test
          POSTGRES_DB: zuse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: cloud
      - run: cargo fmt -p zuse-cloud -p zuse-cloud-api --check
      - run: rustfmt --edition 2024 --check crates/protocol/src/cloud.rs crates/protocol/src/cloud_gateway.rs
      - run: cargo check --locked -p zuse-cloud-api
      - run: cargo test --locked -p zuse-cloud -- --include-ignored
      - run: cargo test --locked -p zuse-protocol cloud
