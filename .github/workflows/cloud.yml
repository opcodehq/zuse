name: Cloud control plane

on:
  push:
    branches: [main]
    paths:
      - apps/cloud/**
      - apps/cloud-runtime/**
      - infra/cloud/**
      - crates/cloud-projection/**
      - crates/client/src/lib.rs
      - crates/client/Cargo.toml
      - crates/cloud-runtime/**
      - crates/providers/src/credentials.rs
      - crates/providers/src/claude/**
      - crates/providers/src/codex/**
      - crates/providers/src/acp/**
      - crates/providers/tests/codex.rs
      - crates/providers/src/lib.rs
      - crates/providers/Cargo.toml
      - crates/cloud/**
      - crates/protocol/src/cloud*.rs
      - crates/protocol/fixtures/runtime-release-*.json
      - crates/protocol/src/session_commands.rs
      - crates/doc/src/commands.rs
      - crates/rpc/src/cloud.rs
      - crates/engine/src/workspace_host.rs
      - crates/engine/src/doc_host.rs
      - crates/engine/src/profile.rs
      - crates/engine/src/lib.rs
      - crates/engine/src/execution.rs
      - crates/engine/src/parking.rs
      - crates/engine/src/sessions.rs
      - crates/engine/src/rpc.rs
      - crates/engine/src/native_harness/**
      - crates/sync/src/store.rs
      - crates/doc/src/queue.rs
      - crates/doc/src/rebuild.rs
      - Cargo.toml
      - Cargo.lock
      - scripts/cloud-provider-benchmark.mjs
      - scripts/cloud-provider-benchmark.test.mjs
      - .github/workflows/cloud.yml
      - .config/nextest.toml
      - scripts/ci-rust.sh
      - scripts/ci_source_cache.py
      - scripts/ci_test_runner.py
      - scripts/ci-linux-linker.sh
  pull_request:
    paths:
      - apps/cloud/**
      - apps/cloud-runtime/**
      - infra/cloud/**
      - crates/cloud-projection/**
      - crates/client/src/lib.rs
      - crates/client/Cargo.toml
      - crates/cloud-runtime/**
      - crates/providers/src/credentials.rs
      - crates/providers/src/claude/**
      - crates/providers/src/codex/**
      - crates/providers/src/acp/**
      - crates/providers/tests/codex.rs
      - crates/providers/src/lib.rs
      - crates/providers/Cargo.toml
      - crates/cloud/**
      - crates/protocol/src/cloud*.rs
      - crates/protocol/fixtures/runtime-release-*.json
      - crates/protocol/src/session_commands.rs
      - crates/doc/src/commands.rs
      - crates/rpc/src/cloud.rs
      - crates/engine/src/workspace_host.rs
      - crates/engine/src/doc_host.rs
      - crates/engine/src/profile.rs
      - crates/engine/src/lib.rs
      - crates/engine/src/execution.rs
      - crates/engine/src/parking.rs
      - crates/engine/src/sessions.rs
      - crates/engine/src/rpc.rs
      - crates/engine/src/native_harness/**
      - crates/sync/src/store.rs
      - crates/doc/src/queue.rs
      - crates/doc/src/rebuild.rs
      - Cargo.toml
      - Cargo.lock
      - scripts/cloud-provider-benchmark.mjs
      - scripts/cloud-provider-benchmark.test.mjs
      - .github/workflows/cloud.yml
      - .config/nextest.toml
      - scripts/ci-rust.sh
      - scripts/ci_source_cache.py
      - scripts/ci_test_runner.py
      - scripts/ci-linux-linker.sh

permissions:
  contents: read

concurrency:
  group: cloud-${{ github.ref }}
  # Main always finishes, so its caches get saved for every branch.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Three parallel jobs: script tests need no Rust build, and the cloud and
# engine suites compile mostly separate crates. Each run's wall time is the
# slowest job rather than the sum of all of them.
jobs:
  checks:
    runs-on: boat-large
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -p zuse-cloud-projection -p zuse-cloud -p zuse-cloud-api -p zuse-cloud-runtime -p zuse-cloud-guest -p zuse-rpc --check
      - run: rustfmt --edition 2024 --check crates/protocol/src/cloud.rs crates/protocol/src/cloud_gateway.rs crates/protocol/src/cloud_commands.rs crates/protocol/src/session_commands.rs crates/protocol/src/cloud_auth.rs crates/protocol/src/cloud_lifecycle.rs crates/protocol/src/cloud_computers.rs crates/protocol/src/cloud_connections.rs
      - run: rustfmt --edition 2024 --config skip_children=true --check crates/engine/src/execution.rs crates/engine/src/parking.rs crates/engine/src/sessions.rs crates/engine/src/rpc.rs crates/engine/src/native_harness/tests.rs crates/engine/src/doc_host.rs crates/engine/src/workspace_host.rs crates/engine/src/profile.rs crates/engine/src/lib.rs crates/sync/src/store.rs crates/doc/src/queue.rs crates/doc/src/rebuild.rs crates/doc/src/commands.rs crates/providers/src/claude/mod.rs crates/providers/src/credentials.rs crates/providers/src/lib.rs crates/providers/src/codex/mod.rs crates/providers/src/codex/auth.rs
      - run: python3 infra/cloud/tests/harness-release.py
      - run: python3 -W error::ResourceWarning infra/cloud/tests/runtime-release.py
      - run: python3 -W error::ResourceWarning infra/cloud/tests/auth-driver.py
      - run: python3 infra/cloud/tests/single-host.py
      - run: python3 infra/cloud/tests/github-app-check.py
      - run: python3 infra/cloud/tests/launch-runtime.py
      - run: python3 infra/cloud/tests/runtime-supervisor.py
      - run: python3 infra/cloud/tests/runtime-update.py
      - run: python3 infra/cloud/tests/runtime-update-launch-repair.py
      - run: python3 infra/cloud/tests/runtime-repair.py
      - run: python3 infra/cloud/tests/runtime-recreation.py
      - run: python3 infra/cloud/tests/recovery-launcher.py
      - run: python3 infra/cloud/tests/managed-base-release.py
      - run: python3 infra/cloud/tests/fetch-harness-candidates.py
      - run: python3 infra/cloud/tests/authority-launcher.py
      - run: python3 -W error::ResourceWarning infra/cloud/tests/user-image-guest.py
      - run: python3 -W error::ResourceWarning infra/cloud/tests/prized-user-image-guest.py
      - run: node --test infra/cloud/tests/build-managed-base.mjs infra/cloud/tests/probe-boxd-supervisor.mjs infra/cloud/tests/probe-boat-supervisor.mjs
      - name: Verify standalone database bootstrap and restricted roles
        run: |
          for candidate in /usr/lib/postgresql/*/bin; do
            if [ -x "$candidate/initdb" ]; then
              export PATH="$candidate:$PATH"
              break
            fi
          done
          python3 infra/cloud/tests/database.py
          python3 -W error::ResourceWarning infra/cloud/tests/account-events.py
      - run: node --test scripts/cloud-provider-benchmark.test.mjs

  cloud:
    runs-on: boat-large
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      ZUSE_CLOUD_TEST_GUEST_BIN: ${{ github.workspace }}/target/ci/zuse-cloud-runtime
      ZUSE_CLOUD_TEST_DATABASE_URL: postgres://zuse_test:zuse_test@127.0.0.1:5432/zuse_test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: zuse_test
          POSTGRES_PASSWORD: zuse_test
          POSTGRES_DB: zuse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure the Linux test linker
        if: runner.os == 'Linux'
        run: bash scripts/ci-linux-linker.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v2-ci
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-workspace-crates: true
          cache-directories: .context/ci-source-cache.json
          shared-key: cloud-validation
      - name: Restore unchanged source timestamps
        run: python3 scripts/ci_source_cache.py restore
      # The plugin Postgres tests run the bundled Executor v2 worker under Bun,
      # pinned to the version the API image ships.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ hashFiles('scripts/ci-ubuntu-dependencies.sh') }}-cmake-clang-lld-libclang-dev-libasound2-dev-ripgrep
      - run: bash scripts/ci-apt-install.sh ~/apt-debs cmake clang lld libclang-dev libasound2-dev ripgrep
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build and test cloud packages once
        run: bash scripts/ci-rust.sh cloud
      - name: Record source fingerprints for the build cache
        if: always()
        run: python3 scripts/ci_source_cache.py save

  runtime-base:
    runs-on: boat-large
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure the Linux test linker
        if: runner.os == 'Linux'
        run: bash scripts/ci-linux-linker.sh
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-ci
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-workspace-crates: true
          cache-directories: .context/ci-source-cache.json
      - name: Restore unchanged source timestamps
        run: python3 scripts/ci_source_cache.py restore
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: cargo test --locked --profile ci -p zuse-cloud-runtime -- --include-ignored

      - name: Record source fingerprints for the build cache
        if: always()
        run: python3 scripts/ci_source_cache.py save

  # Old-runtime matrix: the current server suite against previously released
  # guest runtimes listed in infra/cloud/runtime-compat.json. No-op while the
  # list is empty; non-blocking until it is populated and green.
  compat-releases:
    runs-on: boat-large
    outputs:
      count: ${{ steps.list.outputs.count }}
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra/cloud/runtime-compat.json
          sparse-checkout-cone-mode: false
      - id: list
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          releases = json.load(open("infra/cloud/runtime-compat.json"))["releases"][:3]
          print(f"count={len(releases)}")
          print(f"matrix={json.dumps(releases, separators=(',', ':'))}")
          EOF

  old-runtime:
    name: old runtime ${{ matrix.release.version }}
    needs: compat-releases
    if: needs.compat-releases.outputs.count != '0'
    continue-on-error: true
    runs-on: boat-large
    # Old runtimes are read from the staging release bucket.
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.compat-releases.outputs.matrix) }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      ZUSE_CLOUD_TEST_GUEST_BIN: ${{ github.workspace }}/old-runtime/zuse-cloud-runtime
      ZUSE_CLOUD_TEST_DATABASE_URL: postgres://zuse_test:zuse_test@127.0.0.1:5432/zuse_test
      # Read-only credentials; absent on fork pull requests, which skip the job's tests.
      ZUSE_CLOUD_RUNTIME_R2_BUCKET: ${{ secrets.ZUSE_CLOUD_RUNTIME_R2_BUCKET }}
      ZUSE_CLOUD_RUNTIME_R2_ENDPOINT: ${{ secrets.ZUSE_CLOUD_RUNTIME_R2_ENDPOINT }}
      ZUSE_CLOUD_RUNTIME_R2_ACCESS_KEY_ID: ${{ secrets.ZUSE_CLOUD_RUNTIME_R2_READ_ACCESS_KEY_ID }}
      ZUSE_CLOUD_RUNTIME_R2_SECRET_ACCESS_KEY: ${{ secrets.ZUSE_CLOUD_RUNTIME_R2_READ_SECRET_ACCESS_KEY }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: zuse_test
          POSTGRES_PASSWORD: zuse_test
          POSTGRES_DB: zuse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify old runtime
        id: fetch
        env:
          SHA256: ${{ matrix.release.sha256 }}
          ARCH: ${{ matrix.release.architecture }}
        run: |
          if [ -z "$ZUSE_CLOUD_RUNTIME_R2_BUCKET" ] || [ -z "$ZUSE_CLOUD_RUNTIME_R2_ACCESS_KEY_ID" ]; then
            echo "::notice::Runtime release bucket credentials unavailable; skipping old-runtime suite"
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 infra/cloud/runtime-release.py download --sha256 "$SHA256" --arch "$ARCH" --out "$ZUSE_CLOUD_TEST_GUEST_BIN"
          echo "fetched=true" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.fetch.outputs.fetched == 'true'
      - name: Configure the Linux test linker
        if: runner.os == 'Linux' && steps.fetch.outputs.fetched == 'true'
        run: bash scripts/ci-linux-linker.sh
      - uses: Swatinem/rust-cache@v2
        if: steps.fetch.outputs.fetched == 'true'
        with:

          prefix-key: v2-ci
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-workspace-crates: true
          cache-directories: .context/ci-source-cache.json
          shared-key: cloud-validation
      - name: Restore unchanged source timestamps
        if: steps.fetch.outputs.fetched == 'true'
        run: python3 scripts/ci_source_cache.py restore
      - if: steps.fetch.outputs.fetched == 'true'
        run: sudo apt-get update && sudo apt-get install -y cmake clang lld libclang-dev libasound2-dev ripgrep
      - if: steps.fetch.outputs.fetched == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - if: steps.fetch.outputs.fetched == 'true'
        run: bash scripts/ci-rust.sh cloud-compat
      - name: Record source fingerprints for the build cache
        if: ${{ always() && steps.fetch.outputs.fetched == 'true' }}
        run: python3 scripts/ci_source_cache.py save
