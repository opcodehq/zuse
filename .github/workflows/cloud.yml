name: Cloud control plane

on:
  push:
    paths:
      - apps/cloud/**
      - apps/cloud-runtime/**
      - infra/cloud/**
      - crates/cloud-runtime/**
      - crates/providers/src/credentials.rs
      - crates/providers/src/claude/**
      - crates/providers/src/lib.rs
      - crates/providers/Cargo.toml
      - crates/cloud/**
      - crates/protocol/src/cloud*.rs
      - crates/protocol/src/session_commands.rs
      - crates/doc/src/commands.rs
      - crates/rpc/src/cloud.rs
      - crates/engine/src/doc_host.rs
      - crates/engine/src/profile.rs
      - crates/engine/src/lib.rs
      - crates/sync/src/store.rs
      - crates/doc/src/queue.rs
      - crates/doc/src/rebuild.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/cloud.yml
  pull_request:
    paths:
      - apps/cloud/**
      - apps/cloud-runtime/**
      - infra/cloud/**
      - crates/cloud-runtime/**
      - crates/providers/src/credentials.rs
      - crates/providers/src/claude/**
      - crates/providers/src/lib.rs
      - crates/providers/Cargo.toml
      - crates/cloud/**
      - crates/protocol/src/cloud*.rs
      - crates/protocol/src/session_commands.rs
      - crates/doc/src/commands.rs
      - crates/rpc/src/cloud.rs
      - crates/engine/src/doc_host.rs
      - crates/engine/src/profile.rs
      - crates/engine/src/lib.rs
      - crates/sync/src/store.rs
      - crates/doc/src/queue.rs
      - crates/doc/src/rebuild.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/cloud.yml

permissions:
  contents: read

jobs:
  cloud:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      ZUSE_CLOUD_TEST_GUEST_BIN: ${{ github.workspace }}/target/debug/zuse-cloud-runtime
      ZUSE_CLOUD_TEST_DATABASE_URL: postgres://zuse_test:zuse_test@127.0.0.1:5432/zuse_test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: zuse_test
          POSTGRES_PASSWORD: zuse_test
          POSTGRES_DB: zuse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: cloud
      - run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev libasound2-dev ripgrep
      - run: cargo fmt -p zuse-cloud -p zuse-cloud-api -p zuse-cloud-runtime -p zuse-cloud-guest -p zuse-rpc --check
      - run: rustfmt --edition 2024 --check crates/protocol/src/cloud.rs crates/protocol/src/cloud_gateway.rs crates/protocol/src/cloud_commands.rs crates/protocol/src/session_commands.rs crates/protocol/src/cloud_auth.rs
      - run: cargo check --locked -p zuse-cloud-api -p zuse-cloud-guest
      - run: cargo build --locked -p zuse-cloud-guest
      - run: rustfmt --edition 2024 --config skip_children=true --check crates/engine/src/doc_host.rs crates/engine/src/profile.rs crates/engine/src/lib.rs crates/sync/src/store.rs crates/doc/src/queue.rs crates/doc/src/rebuild.rs crates/doc/src/commands.rs crates/providers/src/claude/mod.rs crates/providers/src/credentials.rs crates/providers/src/lib.rs
      - run: cargo test --locked -p zuse-doc --lib commands::tests
      - run: cargo test --locked -p zuse-doc --lib queued_cloud_request_and_pause_survive_snapshot_and_epoch_rebuild
      - run: cargo test --locked -p zuse-sync --lib hosted_admission_and_processed_claims_use_full_wal_commits
      - run: cargo test --locked -p zuse-cloud-runtime -- --include-ignored
      - run: cargo test --locked -p zuse-cloud -- --include-ignored
      - run: cargo test --locked -p zuse-cloud --features runtime-acceptance --test postgres rust_cloud -- --ignored
      - run: cargo test --locked -p zuse-protocol cloud
