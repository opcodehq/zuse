services:
  api:
    build:
      context: ../..
      dockerfile: infra/cloud/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: true
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
