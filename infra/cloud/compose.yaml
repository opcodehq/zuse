services:
  api:
    build:
      context: ../..
      dockerfile: infra/cloud/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: true
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

  worker:
    profiles: [allocation]
    build:
      context: ../..
      dockerfile: infra/cloud/Dockerfile
    command: [worker]
    environment:
      TMPDIR: /var/lib/zuse/recovery
    volumes:
      - recovery-scratch:/var/lib/zuse/recovery
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

  billing-worker:
    profiles: [billing]
    build:
      context: ../..
      dockerfile: infra/cloud/Dockerfile
    command: [billing-worker]
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

volumes:
  recovery-scratch:
