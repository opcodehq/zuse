[package]
name = "zuse-cloud-guest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zuse-cloud-runtime"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
zuse-doc.workspace = true
clap = { workspace = true, features = ["env"] }
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zuse-cloud-runtime = { path = "../../crates/cloud-runtime", features = ["engine"] }
zuse-engine.workspace = true
zuse-providers.workspace = true
zuse-mcp.workspace = true
zuse-protocol.workspace = true
zuse-rpc.workspace = true
