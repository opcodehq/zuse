[package]
name = "zuse-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zuse-remote.workspace = true
base64 = "0.22"
uuid = { workspace = true, features = ["js"] }
zuse-viewport.workspace = true
zuse-protocol.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
futures.workspace = true
serde_json.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Location", "History", "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event", "Request", "RequestInit", "RequestCredentials", "Response", "Headers", "HtmlInputElement", "HtmlElement", "Node", "File", "FileList", "Blob", "EventTarget", "AbortController", "AbortSignal", "Storage", "console"] }
