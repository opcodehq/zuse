[build]
target = "index.html"
dist = "../../dist/web"
public_url = "/"

[[hooks]]
stage = "post_build"
command = "node"
command_arguments = ["../../scripts/precompress-web.mjs"]

[tools]
wasm_opt = "version_123"

[serve]
addresses = ["127.0.0.1"]
port = 27657
headers = { "Cross-Origin-Opener-Policy" = "same-origin", "Cross-Origin-Embedder-Policy" = "require-corp" }
