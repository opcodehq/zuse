[package]
name = "zuse-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The standalone `zuse` command, without the desktop window. Cargo names it
# zuse-cli beside the desktop app's `zuse`; packages install it as `zuse`, and
# as `zuse-server` for the old interface.
[[bin]]
name = "zuse-cli"
path = "src/main.rs"

[dependencies]
zuse-commands.workspace = true
zuse-engine.workspace = true
clap.workspace = true
anyhow.workspace = true

[dev-dependencies]
zuse-rpc.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile.workspace = true
rcgen = "0.14"
reqwest.workspace = true
tokio-tungstenite.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
futures.workspace = true
