[package]
name = "zuse"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zuse"
path = "src/main.rs"

[dependencies]
zuse-commands.workspace = true
zuse-remote.workspace = true
zuse-engine.workspace = true
zuse-ui.workspace = true
clap.workspace = true
anyhow.workspace = true

# The custom allocator is macOS-only (see main.rs): glibc measured flat on the
# same streaming/scroll workloads, so Linux keeps the system allocator.
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[target.'cfg(windows)'.dependencies]
zuse-update.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[build-dependencies]
embed-resource = "3.0.11"
