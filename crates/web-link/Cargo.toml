[package]
name = "zuse-web-link"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The browser client's paired transport: zuse_remote::link::Link behind wasm-bindgen.
# The page owns the WebSockets and timers; every routing and resume decision is made here.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zuse-remote.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
