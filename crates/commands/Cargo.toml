[package]
name = "zuse-commands"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The `zuse` command tree, shared by the desktop app and the standalone CLI.
# Nothing here may depend on the windowed UI.
[dependencies]
zuse-engine.workspace = true
zuse-i18n.workspace = true
zuse-mcp.workspace = true
zuse-protocol.workspace = true
zuse-remote.workspace = true
zuse-rpc.workspace = true
zuse-serve.workspace = true
zuse-update.workspace = true
anyhow.workspace = true
base64 = "0.22"
clap = { workspace = true, features = ["env"] }
gethostname.workspace = true
libc.workspace = true
qrcode = { version = "0.14", default-features = false }
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
futures.workspace = true
tempfile.workspace = true
