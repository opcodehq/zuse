[package]
name = "zuse-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
runtime-acceptance = ["dep:zuse-engine", "dep:zuse-providers", "dep:zuse-rpc", "dep:tempfile", "dep:tokio-util", "dep:zuse-cloud-runtime"]

[dependencies]
zuse-engine = { workspace = true, optional = true }
zuse-cloud-runtime = { path = "../cloud-runtime", optional = true }
zuse-providers = { workspace = true, optional = true }
zuse-rpc = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }
anyhow.workspace = true
async-trait.workspace = true
aes-gcm = { version = "0.10.3", features = ["std"] }
axum.workspace = true
futures.workspace = true
ed25519-dalek = { version = "2", features = ["pkcs8"] }
chrono.workspace = true
base64 = "0.22"
hmac = "0.12"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
prost = "0.14"
reqwest.workspace = true
rsa = "0.9"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json"] }
tokio.workspace = true
tower-http = { workspace = true, features = ["cors"] }
uuid.workspace = true
zuse-protocol.workspace = true
zeroize = "1"

[dev-dependencies]
libc.workspace = true
tokio-tungstenite.workspace = true
tower = { version = "0.5", features = ["util"] }
rand = "0.8"
