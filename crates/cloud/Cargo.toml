[package]
name = "zuse-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
hosted-browser = ["dep:zuse-engine", "dep:zuse-serve"]
runtime-acceptance = ["zuse-cloud-runtime/engine", "dep:zuse-engine", "zuse-engine/test-support", "dep:zuse-rpc"]

[[example]]
name = "cloud-ui-host"
path = "examples/ui_host.rs"
required-features = ["runtime-acceptance"]

[dependencies]
brokeboy = { git = "https://github.com/opcodehq/brokeboy", rev = "1e35dc7925f7b4df49c05283f687f51a77886e8a", default-features = false, features = ["postgres", "stripe", "polar"] }
zuse-cloud-projection.workspace = true
zuse-engine = { workspace = true, optional = true }
zuse-serve = { workspace = true, optional = true }
zuse-cloud-runtime = { path = "../cloud-runtime", features = ["engine"] }
zuse-providers.workspace = true
zuse-rpc = { workspace = true, optional = true }
tempfile.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
anyhow.workspace = true
async-trait.workspace = true
aes-gcm = { version = "0.10.3", features = ["std"] }
axum.workspace = true
futures.workspace = true
libc.workspace = true
ed25519-dalek = { version = "2", features = ["pkcs8"] }
chrono.workspace = true
base64 = "0.22"
hmac = "0.12"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
prost = "0.14"
quick-xml = { version = "0.41", features = ["serialize"] }
percent-encoding = "2.3"
reqwest.workspace = true
rsa = "0.9"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json"] }
tokio.workspace = true
tracing.workspace = true
tower-http = { workspace = true, features = ["cors"] }
uuid.workspace = true
zuse-protocol.workspace = true
zeroize = "1"

[dev-dependencies]
tracing-subscriber.workspace = true
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
zuse-rpc.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
zuse-doc.workspace = true
rusqlite.workspace = true
tokio-tungstenite.workspace = true
tower = { version = "0.5", features = ["util"] }
rand = "0.8"
