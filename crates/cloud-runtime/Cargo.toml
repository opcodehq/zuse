[package]
name = "zuse-cloud-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
engine = ["dep:zuse-engine", "dep:zuse-doc", "dep:zuse-providers", "dep:loro"]

[dependencies]
tracing.workspace = true
zuse-cloud-projection.workspace = true
zuse-providers = { workspace = true, optional = true }
zuse-engine = { workspace = true, optional = true }
zuse-doc = { workspace = true, optional = true }
tar = { version = "0.4", default-features = false }
loro = { workspace = true, optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
anyhow.workspace = true
async-trait.workspace = true
hmac = "0.12"
aes-gcm = { version = "0.10.3", features = ["std"] }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
libc.workspace = true
rand = "0.8"
reqwest.workspace = true
rsa = "0.9"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
uuid.workspace = true
zeroize = "1"
zuse-protocol.workspace = true
zuse-rpc.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
