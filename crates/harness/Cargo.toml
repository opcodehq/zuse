[package]
name = "zuse-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zuse-command-host"
path = "src/bin/command_host.rs"

[features]
default = ["structural-search"]
structural-search = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-python", "dep:tree-sitter-typescript"]

[dependencies]
tree-sitter = { version = "=0.26.11", optional = true }
tree-sitter-rust = { version = "=0.24.2", optional = true }
tree-sitter-python = { version = "=0.25.0", optional = true }
tree-sitter-typescript = { version = "=0.23.2", optional = true }
async-trait.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt", "codec"] }
futures.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
uuid.workspace = true
base64 = "0.22"
libc.workspace = true
reqwest.workspace = true

[dev-dependencies]
tempfile.workspace = true
